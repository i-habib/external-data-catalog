name: Validate real source releases

on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_real_sources.py'
      - '.github/workflows/validate-real-sources.yml'
      - 'processors/**'
      - 'vec_external/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-real-sources-main
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[real-source-validation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run processors on public releases
        run: python scripts/validate_real_sources.py
      - name: Show validation manifests
        run: |
          for f in validation/*.json; do
            echo "===== $f ====="
            cat "$f"
          done
      - name: Commit observed release evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation
          if git diff --cached --quiet; then
            echo "No validation changes"
            exit 0
          fi
          git commit -m "Record real source validation [real-source-validation] [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
